# Phase 3 — zero-shot transfer GEM-CAN (source) -> HCRL (target).
# PIRD is fit entirely on GEM-CAN normals; threshold on GEM-CAN validation
# normals. HCRL is never used for fitting or threshold selection.
phase: 3
experiment_id: phase3_gem_to_hcrl
seed: 0
window_size: 30
feature_cols: null

split: {calib_frac: 0.4, train_frac: 0.2, test_frac: 0.4}

detector: {kind: isolation_forest, n_estimators: 200, random_state: 0}
evaluation: {fpr_target: 0.01, fixed_fpr_targets: [0.001, 0.01, 0.05, 0.10]}

source:
  dataset: gem_can
  data_dir: GEM_CAN_Dataset_R2/GEM_CAN_Dataset_R2

target:
  dataset: hcrl
  data_dir: data
  datasets: [DoS, Fuzzy, RPM, gear]
  sample_size: 60000

max_frames_per_capture: null
cache_dir: .cache/phase3
output_dir: experiments/phase3/gem_to_hcrl

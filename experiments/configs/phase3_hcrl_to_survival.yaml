# Phase 3 — zero-shot transfer HCRL (source) -> HCRL Survival (target, multi-vehicle).
# STATUS: PENDING — HCRL Survival Analysis not available locally.
# When available, report overall and per-vehicle (Sonata / Kia Soul / Spark).
phase: 3
experiment_id: phase3_hcrl_to_survival
seed: 0
window_size: 30
feature_cols: null
split: {calib_frac: 0.4, train_frac: 0.2, test_frac: 0.4}
detector: {kind: isolation_forest, n_estimators: 200, random_state: 0}
evaluation: {fpr_target: 0.01, fixed_fpr_targets: [0.001, 0.01, 0.05, 0.10]}

source:
  dataset: hcrl
  data_dir: data
  datasets: [DoS, Fuzzy, RPM, gear]
  sample_size: 60000

target:
  dataset: hcrl_survival
  data_dir: data/Survival
  loader: survival
  vehicles: [hyundai_sonata, kia_soul, chevrolet_spark]

cache_dir: .cache/phase3
output_dir: experiments/phase3/hcrl_to_survival
pending: true
pending_reason: "HCRL Survival Analysis not available locally"

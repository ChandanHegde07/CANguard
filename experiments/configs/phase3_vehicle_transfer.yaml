# Phase 3 — cross-vehicle transfer (HCRL Survival Analysis).
# Vehicles: Hyundai Sonata, Kia Soul, Chevrolet Spark. All ordered pairs among
# the available vehicles are run; the target vehicle contributes no data to
# fitting, per-ID statistics, or threshold selection.
phase: 3
experiment_id: phase3_vehicle_transfer
seed: 0
window_size: 30
feature_cols: null
detector: {kind: isolation_forest, n_estimators: 200, random_state: 0}
evaluation: {fpr_target: 0.01, fixed_fpr_targets: [0.001, 0.01, 0.05, 0.10]}

dataset:
  data_dir: survival
  loader: survival
  vehicles: [sonata, kia_soul, chevrolet_spark]

run_recalibration_diagnostic: true
cache_dir: .cache/phase3
output_dir: experiments/phase3/survival_vehicle

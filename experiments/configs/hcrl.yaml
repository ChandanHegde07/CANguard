# PIRD baseline experiment on the HCRL Car-Hacking dataset.
dataset: hcrl
data_dir: HCRL Car-Hacking
sample_size: 60000
window_size: 30
datasets: [DoS, Fuzzy, RPM, gear]

# Temporal split (must sum to 1.0)
split:
  calib_frac: 0.4
  train_frac: 0.2
  test_frac: 0.4

detector:
  kind: isolation_forest
  n_estimators: 200
  random_state: 0

evaluation:
  val_holdout_fraction: 0.2
  fpr_target: 0.01

output_dir: results/hcrl/baseline

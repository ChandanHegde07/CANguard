# Phase 2 — white-box adaptive attack + detection boundary (HCRL).
# PIRD is frozen; only synthetic attacks are added.
phase: 2
experiment_id: phase2_adaptive

seed: 0
dataset: hcrl
data_dir: data
datasets: [DoS, Fuzzy, RPM, gear]
sample_size: 60000
window_size: 30
feature_cols: null

split:
  calib_frac: 0.4
  train_frac: 0.2
  test_frac: 0.4

detector:
  kind: isolation_forest
  n_estimators: 200
  random_state: 0

evaluation:
  val_holdout_fraction: 0.2
  fpr_target: 0.01

# Legitimate target-ID selection uses CALIBRATION labels/statistics only.
targeting:
  top_k: 3
  min_calib_windows: 50
  max_calib_attack_frac: 0.0
  target_ids: null            # null -> auto top-k legitimate IDs

# Pre-registered attack grid. Do not edit after seeing results.
attack:
  type: adaptive_legitimate_id
  target_features: all_attackable   # all 13 non-constant features (worst case)
  severities: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0]
  directions: [positive, negative]
  # mean_shift: literal x = mu + alpha*sigma*direction
  # additive  : x = x_current + alpha*sigma*direction (modify existing message)
  attack_modes: [mean_shift, additive]
  example_severity: 1.0
  drift:
    rates: [fast, medium, slow]
    shape: linear
    horizon_windows: 300
    fractions: null           # optional explicit percentage schedule
    save_trajectories: true

cache_dir: .cache/phase2
output_dir: experiments/phase2
figures_dir: figures/phase2

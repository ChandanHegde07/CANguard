# Phase 1 — PIRD validation framework.
#
# Four experiment groups sharing one config:
#   cross_condition    : fit on one condition's normals -> evaluate on another
#   global_threshold   : one pooled threshold vs per-dataset thresholds
#   residualization    : raw vs global_z vs per_id_z vs MAD vs quantile
#   window_sensitivity : window-size sweep with detection/latency trade-off
#
# All groups report deployment metrics: Recall@fixed FPR, FPR@target recall,
# false alarms/hour, and detection latency.
phase: 1
experiment_id: phase1_pird_validation
seed: 0

# HCRL Car-Hacking: one continuous stream per attack type (temporal 40/20/40).
data_dir: HCRL Car-Hacking
datasets: [DoS, Fuzzy, RPM, gear]
sample_size: null

split: {calib_frac: 0.4, train_frac: 0.2, test_frac: 0.4}
window_size: 30
window_sizes: [10, 20, 30, 50, 100]
feature_cols: null

detector: {kind: isolation_forest, n_estimators: 200, random_state: 0}
evaluation:
  fpr_target: 0.01
  fixed_fpr_targets: [0.001, 0.01, 0.05]
  recall_target: 0.95
  val_holdout_fraction: 0.2

# Representation study + cross-condition / window-sweep representation.
strategies: [raw, global_z, per_id_z, per_id_mad, per_id_quantile]
strategy: per_id_z
# Representations compared under the global-threshold protocol.
threshold_strategies: [per_id_z, global_z]

cache_dir: .cache/phase1
output_dir: experiments/phase1

# Phase 4 — milestone 1: in-domain HCRL prototype + backbone baselines.
phase: 4
experiment_id: phase4_prototype
seed: 0
length: 128
stride: 128
max_frames_per_capture: 150000
max_train_windows: 20000
fpr_target: 0.01

tokenizer: {payload_mode: byte, id_mode: none, id_bits: 11}

model:
  backbone: transformer
  d_model: 128
  nhead: 4
  num_layers: 4
  dim_feedforward: 256
  dropout: 0.1

train:
  objective: next_event
  epochs: 3
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0
  mask_prob: 0.15

backbones: [mlp, gru, transformer]
source: [hcrl]
target: hcrl

cache_dir: .cache/phase4
output_dir: experiments/phase4/results/prototype
